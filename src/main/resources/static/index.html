<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pareidolia Leave Tracker</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">HR SELF SERVICE</p>
    <h1>Request leave</h1>
    <p class="intro">Your manager will receive an email to approve or reject this request.</p>

    <form id="leave-form">
      <label for="employeeEmail">Work email</label>
      <input id="employeeEmail" name="employeeEmail" type="email" autocomplete="email" required placeholder="you@company.com">
      <button id="balance-button" class="link-button" type="button">Check my balance</button>
      <div id="balances" class="balances" aria-live="polite"></div>

      <div class="two-columns">
        <div>
          <label for="leaveType">Leave type</label>
          <select id="leaveType" name="leaveType" required>
            <option value="PL">PL</option>
            <option value="CL">CL</option>
            <option value="SL">SL</option>
          </select>
        </div>
        <div>
          <label for="reason">Reason</label>
          <input id="reason" name="reason" maxlength="1000" required placeholder="Brief reason">
        </div>
      </div>

      <div class="two-columns">
        <div>
          <label for="startDate">Start date</label>
          <input id="startDate" name="startDate" type="date" required>
        </div>
        <div>
          <label for="endDate">End date</label>
          <input id="endDate" name="endDate" type="date" required>
        </div>
      </div>

      <button id="submit-button" type="submit">Send leave request</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
